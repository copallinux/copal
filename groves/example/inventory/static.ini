# The fallback, for a grove built with discovery = static -- a site where mDNS
# is filtered, or a segment where it is not wanted. Nothing here is trusted
# because it is written down: the addresses only say where to knock, and the
# host certificate is still what decides whether the door opens.
#
#     copal grove scene wake -i inventory/static.ini      (ansible-playbook -i)
#
# Discovery being off does not change the identity layer at all, which is
# invariant 8: every layer has to be removable and leave a console that works.

[@GROVE@]
# @GROVE@-01 ansible_host=10.0.0.11
# @GROVE@-02 ansible_host=10.0.0.12

[@GROVE@:vars]
ansible_user=@USER@
ansible_python_interpreter=/usr/bin/python3
