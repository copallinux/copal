# scene: switch on, wait, check, mount what is attached, ready for visitors
---
# THE MORNING. One press, or one cron line, and the room is ready.
#
# The console has already done the two things a playbook cannot: switched the
# power on (a machine that is off has no SSH port) and waited for the beacons
# (an inventory cannot wait for itself to fill). Everything below happens on
# machines that are up and have proved who they are.

- name: wake — can these machines be managed at all
  hosts: all
  gather_facts: false
  tasks:
    - name: python3, which every module after this one needs
      # `raw` deliberately: it is the only thing that works BEFORE we know
      # whether python3 is there, and finding out with a clear message beats
      # finding out through a module's traceback.
      ansible.builtin.raw: command -v python3
      register: copal_py
      changed_when: false
      failed_when: false

    - name: say so plainly when it is missing
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} has no python3, so Ansible cannot manage it.
          Stage 7 installs it. Until then this node can still be driven by
          `copal fleet run`, which needs nothing on the node but sshd.
      when: copal_py.rc != 0

- name: wake — the fleet
  hosts: all
  gather_facts: true
  vars:
    copal_scene: wake
    copal_display_state: "on"
  roles:
    - role: copal_node
    - role: copal_display

  post_tasks:
    - name: what came up
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ copal_role | default('node') }})
          {{ ansible_memtotal_mb | default('?') }} MB,
          up {{ (ansible_uptime_seconds | default(0) / 60) | round | int }} min,
          attachments {{ copal_attachments | length }}
