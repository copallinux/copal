# Ansible for @FLEET@. Scoped to the DAY, not to the build: the sixteen stages
# already installed this machine, with no network dependency and no Python on
# the target. Ansible's job here is the daily play -- apply a scene, gather
# facts, collect logs, restore a snapshot.

[defaults]
inventory            = inventory/copal_fleet.py
roles_path           = roles
interpreter_python   = /usr/bin/python3
forks                = 8
retry_files_enabled  = False
# Ten machines in a museum, one operator, one switch: a full recap of every
# task on every host is noise. Failures still print in full.
display_skipped_hosts = False

# HOST KEY CHECKING IS ON, and it is on because the fleet made it cheap.
# `copal fleet trust` put one @cert-authority line in known_hosts, so every
# node this fleet will ever have validates without a prompt, and a host key
# that CHANGES is an error somebody can explain rather than a warning an
# operator has been trained to press through. Turning this off here would
# throw away the entire reason the fleet has a certificate authority.
host_key_checking = True

[privilege_escalation]
# Alpine has doas, not sudo. The become plugin lives in community.general --
# see requirements.yml.
become_method = community.general.doas

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o BatchMode=yes -o ConnectTimeout=8
